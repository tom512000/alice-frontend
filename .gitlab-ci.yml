stages:
  - commit-lint
  - lint
  - deploy

default:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

commit-lint:
  stage: commit-lint
  image: node:20-alpine
  script:
    - npm ci
    - npx commitlint --last --verbose

lint:
  stage: lint
  image: node:20-alpine
  script:
    - npm ci
    - npm run lint

deploy:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t alice-frontend:$CI_COMMIT_SHORT_SHA .
  # Pas de registre/serveur cible pour l'instant : cette étape vérifie juste que
  # l'image de prod (Dockerfile -> build Vite + nginx) se construit sans erreur.
  # À étendre plus tard avec un `docker push` vers un registre si une cible existe.
